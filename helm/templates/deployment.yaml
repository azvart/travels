apiVersion: apps/v1kind: Deploymentmetadata:  name: {{ .Values.service.name }}  labels:    app: {{ .Values.service.name }}spec:  replicas: {{ .Values.replicaCount }}  selector:    matchLabels:      app: {{ .Values.service.name }}  template:    metadata:      labels:        app: {{ .Values.service.name }}    spec:      containers:        - name: {{ .Values.service.name }}          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"          imagePullPolicy: {{ .Values.image.pullPolicy }}          ports:            - containerPort: {{ .Values.service.port }}          # Переменные из ConfigMap          envFrom:            - configMapRef:                name: {{ .Values.service.name }}-config            - secretRef:                name: {{ .Values.service.name }}-secret                optional: true          livenessProbe:            httpGet:              path: {{ .Values.healthCheck.path }}              port: {{ .Values.service.port }}            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}            periodSeconds: {{ .Values.healthCheck.periodSeconds }}          readinessProbe:            httpGet:              path: {{ .Values.healthCheck.path }}              port: {{ .Values.service.port }}            initialDelaySeconds: 5            periodSeconds: 5          resources:            {{- toYaml .Values.resources | nindent 12 }}