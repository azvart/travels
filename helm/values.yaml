# Имя сервиса — переопределяется в values-{service}.yamlservice:  name: my-service  port: 3000image:  repository: my-registry/my-service  tag: latest  pullPolicy: IfNotPresentreplicaCount: 2resources:  requests:    cpu: 100m    memory: 128Mi  limits:    cpu: 500m    memory: 512Mienv: {}  # NODE_ENV: production# DATABASE_URL: postgres://...secrets: {}# JWT_SECRET: <base64>ingress:  enabled: false  host: ""  path: /hpa:  enabled: false  minReplicas: 2  maxReplicas: 10  cpuUtilization: 70healthCheck:  path: /health  initialDelaySeconds: 15  periodSeconds: 10