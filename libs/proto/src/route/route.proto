syntax = 'proto3';package route;service Route {  rpc createRoute(CreateRouteInput) returns (Routes);  rpc updateRoute(UpdateRouteInput) returns (Routes);  rpc findManyRoutes(FindManyRoutesInput) returns (FindManyRoutesOutput);  rpc findOneRoute(FindOneRouteInput) returns (Routes);  rpc deleteUserRoute(DeleteUserRouteInput) returns (DeleteUserRouteOutput);}message Routes {  string id = 1;  string routeName = 2;  string userId = 3;  string country = 4;  double distance = 5;  string durationLabel = 6;  int32 pointsCount = 7;  string difficulty = 8;  repeated RoutePoints points = 9;}message RoutePoints {  string id = 1;  double latitude = 2;  double longitude = 3;  int32 order = 4;  optional string title = 5;}message CreateRouteInput {  string routeName = 1;  string country = 2;  string userId = 3;  double distance = 4;  string durationLabel = 5;  int32 pointsCount = 6;  string difficulty = 7;  repeated RoutePoints points = 8;}message UpdateRouteInput {  string id = 1;  string routeName = 2;  string userId = 3;  optional string country = 4;  optional int32 distance = 5;  optional string durationLabel = 6;  optional int32 pointsCount = 7;  optional string difficulty = 8;}message FindManyRoutesInput {  optional string country = 1;  bool externalRoutes = 2;  string userId = 3;}message FindManyRoutesOutput {  repeated Routes routes = 1;}message FindOneRouteInput {  string id = 1;}message DeleteUserRouteInput {  string id = 1;  string userId = 2;}message DeleteUserRouteOutput {  string id = 1;}