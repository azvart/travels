syntax = 'proto3';import 'google/protobuf/wrappers.proto';import 'google/protobuf/empty.proto';package account;service Account {  rpc createAccount(CreateAccount) returns (TokenType);  rpc updateAccount(UpdateAccount) returns (AccountInterface);  rpc deleteAccount(DeleteAccount) returns (google.protobuf.BoolValue);  rpc login(Login) returns (TokenType);  rpc updateUser(UpdateUser) returns (UserInterface);  rpc refreshToken(RefreshToken) returns (TokenType);  rpc getUser (GetUser) returns (UserInterface);  rpc getUserTelemetry(GetUserTelemetry) returns (UserTelemetryInterface);  rpc getUserGamification(GetUser) returns (UserGamificationInterface);  rpc updateUserTelemetry(UpdateUserTelemetry) returns (google.protobuf.BoolValue);  rpc createUserTelemetry(CreateUserTelemetry) returns (UserTelemetryInterface);  rpc createUserStatistic(CreateUserStatistic) returns(UserStatisticInterface);  rpc updateUserStatistic(UpdateUserStatisticInterface) returns(UserStatisticInterface);  rpc findManyUserStatistics(google.protobuf.Empty) returns (FindManyUserStatisticsOutput);  rpc findOneUserStatistic(FindOneUserStatistic) returns (UserStatisticInterface);}enum UserRoleEnum {  UNSPECIFIED = 0;  ADMIN = 1;  USER = 2;}message UserGamificationInterface {  string id = 1;  optional UserInterface user = 2;  int32 userLevel = 3;  int32 userLevelProgress = 4;}message UserStatisticInterface {  string id = 1;  int32 steps = 2;  int32 createdRoutes = 3;  int32 finishedRoutes = 4;  int32 grantedAwards = 5;  int32 finishedQuests = 6;  int32 attachedQuests = 7;  repeated string countries = 8;  optional string userId = 9;  optional UserInterface user = 10;}message CreateUserStatistic {  string userId = 1;}message UpdateUserStatisticData {  optional int32 steps = 2;  optional int32 createdRoutes = 3;  optional int32 finishedRoutes = 4;  optional int32 grantedAwards = 5;  optional int32 finishedQuests = 6;  optional int32 attachedQuests = 7;}message UpdateUserStatisticInterface {  string userId = 1;  UpdateUserStatisticData data = 2;}message FindManyUserStatisticsOutput {  repeated UserStatisticInterface data = 1;}message FindOneUserStatistic {  string userId = 1;}message CreateUserTelemetry{  string userId = 1;  string routeId = 2;}message GetUserTelemetry {  string userId = 1;  string routeId = 2;}message UpdateUserTelemetry {  string userId = 1;  string routeId = 2;  int32 steps = 3;  int32 duration = 4;  int32 avgPace = 5;}message UserTelemetryInterface { string id = 1; string userId = 2; int32 duration = 3; int32 steps = 4; int32 avgPace = 5; string routeId = 6;}message TokenType {  string id = 1;  string token = 2;  string refreshToken = 3;}message AccountInterface {  string id = 1;  string email = 2;  string password = 3;  string registrationType = 4;}message UserInterface {  string id = 1;  optional string firstName = 2;  optional string lastName = 3;  optional int32 age = 4;  optional string country = 5;  optional string countryCode = 6;  optional string street = 7;  optional string city = 8;  optional AccountInterface account = 9;}message CreateAccount {  string email = 1;  string password = 2;}message UpdateAccount {  string id = 1;  optional string email = 2;  optional string password = 3;}message DeleteAccount {  string accountId = 1;}message Login {  string email = 1;  string password = 2;}message UpdateUser {  string id = 1;  optional string firstName = 2;  optional string lastName = 3;  optional int32 age = 4;  optional string country = 5;  optional string countryCode = 6;  optional string street = 7;  optional string city = 8;}message RefreshToken {  string refreshToken = 1;}message GetUser {  string userId = 1;  string accountId = 2;  string email = 3;  UserRoleEnum role = 4;}