syntax = 'proto3';import 'google/protobuf/wrappers.proto';package account;service Account {  rpc createAccount(CreateAccount) returns (TokenType);  rpc updateAccount(UpdateAccount) returns (AccountInterface);  rpc deleteAccount(DeleteAccount) returns (google.protobuf.BoolValue);  rpc login(Login) returns (TokenType);  rpc updateUser(UpdateUser) returns (UserInterface);  rpc refreshToken(RefreshToken) returns (TokenType);  rpc getUser (GetUser) returns (UserInterface);}message TokenType {  string id = 1;  string token = 2;  string refreshToken = 3;}message AccountInterface {  string id = 1;  string email = 2;  string password = 3;  string registrationType = 4;}message UserInterface {  string id = 1;  optional string firstName = 2;  optional string lastName = 3;  optional int32 age = 4;  optional string country = 5;  optional string countryCode = 6;  optional string street = 7;  optional string city = 8;  optional AccountInterface account = 9;}message CreateAccount {  string email = 1;  string password = 2;}message UpdateAccount {  string id = 1;  optional string email = 2;  optional string password = 3;}message DeleteAccount {  string accountId = 1;}message Login {  string email = 1;  string password = 2;}message UpdateUser {  string id = 1;  optional string firstName = 2;  optional string lastName = 3;  optional int32 age = 4;  optional string country = 5;  optional string countryCode = 6;  optional string street = 7;  optional string city = 8;}message RefreshToken {  string refreshToken = 1;}message GetUser {  string userId = 1;  string accountId = 2;  string email = 3;}