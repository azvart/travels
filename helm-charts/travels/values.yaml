replicaCount: 1env:  ENV: "dev"externalSecret:  secretStore:    createSecretStore:      enabled: trueimage:#  repository: dockerhub.gosystem.io/travels  pullPolicy: IfNotPresent  # Overrides the image tag whose default is the chart appVersion.  tag: 'latest'  imagePullSecrets: regcredpodAnnotations:  sidecar.istio.io/inject: 'true'service:  enabled: true  type: ClusterIP  port: 4000  metricsport: 5000servicemonitor:  enabled: falsekeda: {}deployment:  enabled: truerollout:  enabled: false  istioVirtualService: "some-value" # Fill by argo parameters  steps:    - setCanaryScale:        replicas: 1    - pause: {} # Pause indefinitely for manual verification    - setWeight: 100    - setCanaryScale:        matchTrafficWeight: true    - pause: {} # Pause indefinitely for manual verificationHealthChecks:  livenessProbe:    enabled: false  readinessProbe:    enabled: falselivenessProbe:  initialDelaySeconds: 15  periodSeconds: 5  timeoutSeconds: 5  successThreshold: 1  failureThreshold: 5  httpGet:    path: /    port: 8000readinessProbe: []  # httpGet:  #   path: /health  #   port: http  # initialDelaySeconds: 15  # periodSeconds: 2  # timeoutSeconds: 5  # successThreshold: 1# failureThreshold: 10nodeSelector: {}tolerations: []affinity: {}resources: {}