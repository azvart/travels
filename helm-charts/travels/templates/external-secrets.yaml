{{ if and (eq .Values.kind "backend") .Values.externalSecret }}apiVersion: external-secrets.io/v1kind: ExternalSecretmetadata:  name: {{ .Release.Name }}-external-secret  annotations:    force-sync: "{{ (now).Unix }}"spec:  refreshInterval: "87660h" # Zero value persistent and cannot be refreshed  secretStoreRef:    name: {{ .Values.externalSecret.secretStore.name | default (printf "%s-secrets-store" .Release.Name) }}    kind: {{ .Values.externalSecret.secretStore.kind | default "SecretStore" }}  target:    name: {{ .Release.Name }}-secrets    creationPolicy: Owner  dataFrom:    - extract:        key: {{ .Values.externalSecret.vaultPath }}{{- end }}