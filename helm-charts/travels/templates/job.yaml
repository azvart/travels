{{ if or (eq .Values.kind "migrations") (eq .Values.kind "mongo-migrations") }}apiVersion: batch/v1kind: Jobmetadata:  labels:    app: {{ .Release.Name }}  name: {{ .Release.Name }}-{{randNumeric 6}}spec:  backoffLimit: 1  activeDeadlineSeconds: 600  ttlSecondsAfterFinished: 600  template:    metadata:      annotations:        sidecar.istio.io/inject: "false"      labels:        app: {{ .Release.Name }}    spec:      restartPolicy: Never      imagePullSecrets:        - name: regcred      containers:        - name: {{ .Release.Name }}          {{- if .Values.job.command }}          command: ["yarn", {{ .Values.job.command | quote }}]          {{- end}}          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"          {{- if .Values.env }}          envFrom:            - configMapRef:                name: "{{ .Release.Name }}-env"          {{- end}}          {{- if .Values.secrets }}            - secretRef:                name: "{{ .Release.Name }}-secrets"          {{- end}}          {{- if .Values.externalSecret }}            - secretRef:                name: "{{ .Release.Name }}-secrets-migrations"          {{- end}}{{- end }}