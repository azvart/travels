{{ if and (eq .Values.kind "backend") .Values.service.enabled }}apiVersion: v1kind: Servicemetadata:  name: {{ include "travels.fullname" . }}  labels:    {{- include "travels.labels" . | nindent 4 }}    role: stablespec:  type: {{ .Values.service.type }}  ports:    - port: {{ .Values.service.port }}      targetPort: {{ .Values.service.port }}      protocol: TCP      name: http    {{- if .Values.servicemonitor.enabled }}    - port: {{ .Values.service.metricsport }}      targetPort: {{ .Values.service.metricsport }}      protocol: TCP      name: metrics    {{- end }}  selector:    {{- include "travels.selectorLabels" . | nindent 4 }}{{- end }}