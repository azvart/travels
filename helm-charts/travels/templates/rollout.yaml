{{ if and (eq .Values.kind "backend") .Values.rollout.enabled }}apiVersion: argoproj.io/v1alpha1kind: Rolloutmetadata:  labels:    app: {{ .Release.Name }}  name: {{ .Release.Name }}spec:  {{- if not .Values.keda.enabled }}  replicas: {{ .Values.replicaCount }}  {{- end }}  selector:    matchLabels:      {{- include "travels.selectorLabels" . | nindent 6 }}  strategy:    canary:      canaryService: {{ include "travels.fullname" . }}-canary      stableService: {{ include "travels.fullname" . }}      canaryMetadata:        labels:          app.kubernetes.io/component: canary      stableMetadata:        labels:          app.kubernetes.io/component: stable      trafficRouting:        istio:          virtualService:            name: {{ .Values.rollout.istioVirtualService }}            routes:              - primary      steps:        {{- toYaml .Values.rollout.steps | nindent 8 }}  template:    metadata:    {{- with .Values.podAnnotations }}      annotations:        {{- toYaml . | nindent 8 }}    {{- end }}      labels:        {{- include "travels.selectorLabels" . | nindent 8 }}    spec:      imagePullSecrets:        - name: {{ .Values.image.imagePullSecrets }}      securityContext:        {{- toYaml .Values.podSecurityContext | nindent 8 }}      containers:        - name: {{ .Chart.Name }}          securityContext:            {{- toYaml .Values.securityContext | nindent 12 }}          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"          imagePullPolicy: {{ .Values.image.pullPolicy }}          env:            - name: MEMORY_LIMIT              valueFrom:                resourceFieldRef:                  resource: limits.memory                  divisor: 1Mi          {{- if .Values.env }}          envFrom:            - configMapRef:                name: "{{ .Release.Name }}-env"          {{- end}}          {{- if or .Values.secrets .Values.externalSecret }}            - secretRef:                name: "{{ .Release.Name }}-secrets"          {{- end}}          ports:            - name: http              containerPort: {{ .Values.service.port }}              protocol: TCP            {{- if .Values.servicemonitor.enabled }}            - name: metrics              containerPort: {{ .Values.service.metricsport }}              protocol: TCP            {{- end }}          {{- if .Values.HealthChecks.livenessProbe.enabled -}}          {{ if .Values.livenessProbe -}}          livenessProbe:          {{- toYaml .Values.livenessProbe | nindent 12 }}          {{- end }}          {{- end }}          {{- if .Values.HealthChecks.readinessProbe.enabled -}}          {{ if .Values.readinessProbe -}}          readinessProbe:          {{- toYaml .Values.readinessProbe | nindent 12 }}          {{- end }}          {{- end }}          {{- if .Values.startupProbe -}}          startupProbe:          {{- toYaml .Values.startupProbe | nindent 12 }}          {{ end }}          resources:            {{- toYaml .Values.resources | nindent 12 }}      {{- with .Values.nodeSelector }}      nodeSelector:        {{- toYaml . | nindent 8 }}      {{- end }}      {{- with .Values.affinity }}      affinity:        {{- toYaml . | nindent 8 }}      {{- end }}      {{- with .Values.tolerations }}      tolerations:        {{- toYaml . | nindent 8 }}      {{- end }}{{- end }}