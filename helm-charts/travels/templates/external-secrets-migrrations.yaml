{{ if and (eq .Values.kind "migrations") .Values.externalSecret }}apiVersion: external-secrets.io/v1kind: ExternalSecretmetadata:  name: {{ .Release.Name }}-external-secret-migrations  annotations:    force-sync: "{{ (now).Unix }}"spec:  refreshInterval: "87660h" # Zero value persistent and cannot be refreshed  secretStoreRef:    name: {{ .Values.externalSecret.secretStore.name | default (printf "%s-secrets-store" .Release.Name) }}    kind: {{ .Values.externalSecret.secretStore.kind | default "SecretStore" }}  target:    name: {{ .Release.Name }}-secrets-migrations    creationPolicy: Owner  data:    - secretKey: DB_PASSWORD      remoteRef:        key: {{ .Values.externalSecret.vaultPath }}        property: {{ .Values.env.DB_NAME | upper }}_DB_PASSWORD        decodingStrategy: None{{- end }}